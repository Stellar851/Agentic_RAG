<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Agentic RAG - 企业智能多文档关联知识库</title>
    <!-- Google Fonts 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- Marked.js Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <!-- 独立外置样式表 -->
    <link rel="stylesheet" href="/static/css/index.css?v=2.0">

</head>

<body>

    <!-- 顶部状态导航 -->
    <header>
        <div class="brand-container">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
            </div>
            <div class="brand-title">
                Agentic RAG
                <span class="brand-badge">多文档穿透关联 + 历史记忆</span>
            </div>
        </div>

        <div class="status-indicators">
            <!-- 本地 Ollama 向量库状态 -->
            <div class="status-pill" id="ollama-status-pill" title="本地 Ollama BGE-M3 向量嵌入引擎">
                <span class="status-dot" id="ollama-dot"></span>
                <span>向量引擎: <strong id="ollama-text">检测中...</strong></span>
            </div>
        </div>
    </header>

    <div class="app-body">
        <!-- 左侧边栏：会话历史与文档管理 -->
        <aside class="sidebar">
            <!-- 新建会话按钮 -->
            <div class="sidebar-actions">
                <button class="btn-new-chat" id="btn-new-chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    新建对话
                </button>
            </div>

            <!-- 历史会话记录列表 -->
            <!-- 历史会话分组标题栏与计数徽章 -->
            <div class="sidebar-section-header" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 8px; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">
                <span>历史对话</span>
                <span class="badge" id="sessions-count" style="background: rgba(99, 102, 241, 0.12); color: var(--primary); padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 700;">0</span>
            </div>

            <!-- 历史会话记录列表 -->
            <div class="session-list-container" id="sessions-list" style="flex: 1; overflow-y: auto; padding: 6px 12px 16px;">
                <!-- 动态渲染各会话 -->
            </div>


        </aside>

        <!-- 右侧主对话区 -->
        <main class="chat-main">
            <div class="messages-container" id="messages-container">
                <!-- 欢迎指示区 -->
                <div class="welcome-hero" id="welcome-hero">
                    <h1>企业智能多文档关联分析系统</h1>
                    <p>
                        基于 <strong>Agentic RAG（多跳工具调用循环）</strong> 与 <strong>持久化多轮历史记忆</strong> 构建。<br>
                        支持连续追问、上下文指代消解与跨文档穿透求证，问答记录自动永久保存。
                    </p>
                    <div class="sample-queries">
                        <div class="sample-query-chip" onclick="applySampleQuery('对比知识库中不同文档提及的技术方案与架构差异')">
                            <span>🔍 对比知识库中不同文档提及的技术方案与架构差异</span>
                            <span>→</span>
                        </div>
                        <div class="sample-query-chip" onclick="applySampleQuery('文档A中提到的模块，在文档B中是如何做接口对接与配置的？')">
                            <span>🔗 追溯跨文档的接口与业务调用逻辑链条</span>
                            <span>→</span>
                        </div>
                        <div class="sample-query-chip" onclick="applySampleQuery('总结梳理当前知识库涵盖的所有核心业务实体与相互关系')">
                            <span>📊 全局梳理多文档关联的核心概念与实体网络</span>
                            <span>→</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 现代化聊天输入框 (类似 Google Gemini / Claude 3.5 风格集成卡片) -->
            <div class="input-bar-container">
                <div class="input-box-wrapper">
                    <!-- 多行弹性文本域 -->
                    <textarea id="user-input" rows="1"
                        placeholder="向 Agent 提问或追问...（支持多轮上下文与代词指代，按 Enter 发送，Shift+Enter 换行）"
                        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>

                    <!-- 底部集成式工具栏 (Action Bar) -->
                    <div class="input-action-bar">
                        <!-- 左侧：内嵌在输入框的 Gemini 风格思考模型热切换胶囊 -->
                        <div class="input-action-left">
                            <div class="gemini-pill-dropdown-wrapper" id="gemini-dropdown-wrapper">
                                <button class="gemini-pill-btn" id="gemini-pill-btn" type="button" aria-haspopup="true" aria-expanded="false" title="点击热切换底层思考模型">
                                    <span class="gemini-pill-sparkle">✨</span>
                                    <span class="gemini-pill-title" id="gemini-pill-current-name">3.8-flash</span>
                                    <svg class="gemini-pill-arrow" viewBox="0 0 24 24" width="16" height="16">
                                        <path d="M7 10l5 5 5-5z" fill="currentColor"/>
                                    </svg>
                                </button>

                                <!-- 隐藏的兼容字段（保持原 ID 保证向后兼容） -->
                                <input type="hidden" id="model-select" value="qwen3.8-flash">

                                <!-- 浮动卡片式弹窗 (向上展开 popover-upward) -->
                                <div class="gemini-popover-menu popover-upward" id="gemini-popover-menu">
                                    <div class="gemini-menu-items" id="gemini-model-list-container">
                                        <!-- JS 动态渲染模型列表 -->
                                    </div>
                                    <div class="gemini-popover-footer">
                                        <div class="gemini-footer-left">
                                            <span>⚡ 思考引擎</span>
                                        </div>
                                        <div class="gemini-footer-right">
                                            <span>ReAct 多跳</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <span class="input-hint-badge">Enter 发送 · Shift+Enter 换行</span>
                        </div>

                        <!-- 右侧：发送提问 与 终止回答 切换按钮 -->
                        <div class="input-action-right">
                            <!-- 发送按钮 (流行圆形深色/主色按钮) -->
                            <button class="btn-chat-action btn-send" id="btn-send" onclick="sendMessage()" title="发送提问">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="19" x2="12" y2="5"></line>
                                    <polyline points="5 12 12 5 19 12"></polyline>
                                </svg>
                            </button>

                            <!-- 终止回答按钮 (流行深色圆底 + 白色实心正方形 ■，带停止呼吸光效) -->
                            <button class="btn-chat-action btn-stop" id="btn-stop" style="display: none;" title="终止回答">
                                <div class="stop-icon-square"></div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 前端核心交互逻辑 -->
        <!-- 独立外置核心交互脚本 -->
    <script src="/static/js/index.js?v=2.2"></script>

</body>

</html>
